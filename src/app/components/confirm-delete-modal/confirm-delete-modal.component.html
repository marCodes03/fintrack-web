@if (isOpen) {
  <div animate.leave="overlay-leave" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Clickable dark backdrop -->
    <div (click)="onClose()" aria-hidden="true" class="fixed inset-0 scrim md:backdrop-blur-xs transition-opacity duration-200 animate-in fade-in"></div>

    <!-- Modal Card Container -->
    <div appDialog aria-label="Confirm delete" (dialogClose)="onClose()" class="relative w-full max-w-md bg-surface-card border border-border-subtle rounded-xl shadow-2xl p-6 z-10 space-y-5 animate-in scale-in duration-200">
      
      <!-- Icon & Header -->
      <div class="flex items-start space-x-4">
        <div class="h-12 w-12 rounded-xl bg-accent-rose/10 text-accent-rose flex items-center justify-center text-xl shrink-0">
          <app-icon name="alert"/>
        </div>
        <div class="space-y-1">
          <h2 class="text-base font-bold text-text-heading leading-snug">{{ title }}</h2>
          <p class="text-sm text-text-body leading-normal">
            Delete <strong class="text-text-body font-semibold">"{{ itemName }}"</strong> permanently? This can't be undone.
          </p>
        </div>
      </div>

      <!-- Description instruction -->
      <div id="confirm-delete-hint" class="p-3 bg-surface-subtle border border-border-subtle rounded-xl text-xs font-medium text-text-muted leading-normal">
        {{ description }}
      </div>

      <!-- Confirmation input form -->
      <div class="space-y-2">
        <label for="confirmationInput" class="block text-xs font-semibold text-text-muted uppercase tracking-wider">
          Confirmation Text
        </label>
        <input id="confirmationInput" aria-describedby="confirm-delete-hint" type="text" placeholder="delete" autocomplete="off" [(ngModel)]="confirmationInput" (keyup.enter)="onConfirm()"
          class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-accent-rose text-base">
      </div>

      <!-- Bottom controls -->
      <div class="flex items-center space-x-3 pt-2">
        <button type="button" (click)="onClose()"
          class="flex-1 bg-surface-subtle hover:bg-border-subtle text-text-body font-bold py-2.5 px-4 rounded-xl transition-[color,background-color,border-color,opacity,transform] text-xs">
          Cancel
        </button>
        <button type="button" (click)="onConfirm()" [disabled]="isConfirmDisabled()" aria-describedby="confirm-delete-hint"
          class="flex-1 bg-accent-rose hover:opacity-90 text-on-accent font-bold py-2.5 px-4 rounded-xl transition-[color,background-color,border-color,opacity,transform] text-xs disabled:opacity-30 disabled:cursor-not-allowed">
          Delete permanently
        </button>
      </div>

    </div>
  </div>
}
