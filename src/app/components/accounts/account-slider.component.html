@if (isOpen) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- Backdrop -->
    <div (click)="onClose()" class="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-xs transition-opacity duration-300 animate-in fade-in"></div>

    <!-- Slide Panel -->
    <div class="relative w-96 max-w-full bg-surface-card border-l border-border-subtle h-full flex flex-col shadow-2xl z-10 animate-in slide-in-from-right duration-300">
      <div class="flex items-center justify-between p-5 border-b border-border-subtle">
        <h3 class="text-sm font-bold text-text-heading">{{ isEditMode ? 'Edit Account' : 'Add New Account' }}</h3>
        <button (click)="onClose()" class="text-text-muted hover:text-text-heading transition-colors p-1.5 rounded-lg hover:bg-surface-subtle">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-5">
        @if (errorMessage()) {
          <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/25 text-rose-500 text-xs">
            {{ errorMessage() }}
          </div>
        }

        <!-- Account Name -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Account Name *</label>
          <input type="text" [(ngModel)]="name" placeholder="e.g. BPI Savings, GCash, Wallet"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-emerald-500 text-sm">
        </div>

        <!-- Account Type -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Account Type *</label>
          <select [(ngModel)]="type" class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
            @for (at of accountTypes; track at.id) {
              <option [value]="at.code">{{ at.icon }} {{ at.label }}</option>
            } @empty {
              <option value="CASH">💵 Cash</option>
              <option value="BANK">🏦 Bank Account</option>
              <option value="CREDIT">💳 Credit Card</option>
              <option value="SAVINGS">🏧 Savings Account</option>
              <option value="E_WALLET">📱 E-Wallet</option>
            }
          </select>
        </div>

        <!-- Initial/Current Balance -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Current Balance (₱)</label>
          <input type="number" [(ngModel)]="balance" placeholder="0.00" step="0.01"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-emerald-500 text-sm">
        </div>
      </div>

      <div class="p-5 border-t border-border-subtle bg-surface-subtle/50 space-y-2">
        <button (click)="onSubmit()" [disabled]="isLoading()"
          class="w-full bg-emerald-500 hover:bg-emerald-600 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-bold py-3 px-4 rounded-xl transition-all text-sm disabled:opacity-50 flex items-center justify-center space-x-2">
          @if (isLoading()) {
            <span>Saving...</span>
          } @else {
            <span>{{ isEditMode ? 'Update Account' : 'Save Account' }}</span>
          }
        </button>
        <button (click)="clearForm()" class="w-full bg-surface-subtle hover:bg-border-subtle text-text-body font-bold py-2.5 px-4 rounded-xl transition-all text-sm">
          Clear Form
        </button>
        <button (click)="onClose()" class="w-full bg-surface-card border border-border-subtle hover:bg-surface-subtle text-text-muted font-bold py-2.5 px-4 rounded-xl transition-all text-sm">
          Cancel
        </button>
      </div>
    </div>
  </div>
}
