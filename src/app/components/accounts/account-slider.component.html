@if (isOpen) {
  <div animate.leave="overlay-leave" class="fixed inset-0 z-50 flex justify-end">
    <!-- Backdrop -->
    <div (click)="onClose()" aria-hidden="true" class="fixed inset-0 scrim md:backdrop-blur-xs animate-in duration-300 fade-in"></div>

    <!-- Slide Panel -->
    <div appDialog aria-label="Account form" (dialogClose)="onClose()" class="relative w-96 max-w-full bg-surface-card border-l border-border-subtle h-full flex flex-col shadow-2xl z-10 animate-in slide-in-from-right duration-300">
      <div class="flex items-center justify-between p-5 border-b border-border-subtle">
        <h2 class="text-sm font-bold text-text-heading">{{ isEditMode ? 'Edit Account' : 'Add New Account' }}</h2>
        <button (click)="onClose()" type="button" aria-label="Close" class="text-text-muted hover:text-text-heading transition-colors p-1.5 rounded-lg hover:bg-surface-subtle">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-5">
        @if (errorMessage()) {
          <div role="alert" animate.enter="banner-enter" animate.leave="banner-leave" class="p-3 rounded-xl bg-accent-rose/10 border border-accent-rose/25 text-accent-rose text-xs">
            {{ errorMessage() }}
          </div>
        }

        <!-- Account Name -->
        <div>
          <label for="account-slider-f1" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Account Name *</label>
          <input id="account-slider-f1" [attr.aria-invalid]="fieldErrors()['f1'] ? 'true' : null" [attr.aria-describedby]="fieldErrors()['f1'] ? 'account-slider-f1-err' : null" type="text" [(ngModel)]="localName" placeholder="e.g. BPI Savings, GCash, Wallet"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-accent-emerald text-base">
          @if (fieldErrors()['f1']) {
            <p id="account-slider-f1-err" animate.enter="banner-enter" class="text-xs text-accent-rose mt-1">{{ fieldErrors()['f1'] }}</p>
          }
        </div>

        <!-- Account Type -->
        <div>
          <label for="account-slider-f2" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Account Type *</label>
          <select id="account-slider-f2" [(ngModel)]="localType" class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-accent-emerald text-base">
            @for (at of accountTypes; track at.id) {
              <option [value]="at.code">{{ at.icon }} {{ at.label }}</option>
            } @empty {
              <option value="CASH">Cash</option>
              <option value="BANK">Bank Account</option>
              <option value="CREDIT">Credit Card</option>
              <option value="SAVINGS">Savings Account</option>
              <option value="E_WALLET">E-Wallet</option>
            }
          </select>
        </div>

        <!-- Initial/Current Balance -->
        <div>
          <label for="account-slider-f3" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Current Balance (₱)</label>
          <input id="account-slider-f3" type="number" inputmode="decimal" [(ngModel)]="localBalance" placeholder="0.00" step="0.01"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-accent-emerald text-base">
        </div>
      </div>

      <div class="p-5 border-t border-border-subtle bg-surface-subtle/50 space-y-2">
        <button type="button" (click)="onSubmit()" [disabled]="isLoading()"
          class="w-full bg-accent-emerald hover:opacity-90 text-on-accent font-bold py-3 px-4 rounded-xl transition-[color,background-color,border-color,opacity,transform] text-sm disabled:opacity-50 flex items-center justify-center space-x-2">
          @if (isLoading()) {
            <span>Saving...</span>
          } @else {
            <span>{{ isEditMode ? 'Update Account' : 'Save Account' }}</span>
          }
        </button>
        <button (click)="onClose()" type="button" aria-label="Close" class="w-full bg-surface-card border border-border-subtle hover:bg-surface-subtle text-text-muted font-bold py-2.5 px-4 rounded-xl transition-[color,background-color,border-color,opacity,transform] text-sm">
          Cancel
        </button>
      </div>
    </div>
  </div>
}
