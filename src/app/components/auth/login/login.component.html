<div class="min-h-screen bg-bg-main text-text-body flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans transition-colors duration-300">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <img src="logo.png" alt="FinTrack Logo" class="mx-auto h-16 w-16 object-contain animate-bounce" />
    <h2 class="mt-6 text-3xl font-extrabold tracking-tight text-text-heading">
      Welcome to FinTrack
    </h2>
    <p class="mt-2 text-sm text-text-muted">
      Or
      <a routerLink="/register" class="font-medium text-emerald-505 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
        create a new account
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-surface-card border border-border-subtle p-8 rounded-2xl shadow-md">
      <form (submit)="handleLogin(); $event.preventDefault()" class="space-y-6">
        
        @if (errorMessage()) {
          <div class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/25 text-rose-500 text-sm">
            {{ errorMessage() }}
          </div>
        }

        <div>
          <label for="email" class="block text-sm font-medium text-text-muted">
            Email address
          </label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="email"
              class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-3 text-input-text placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-text-muted">
            Password
          </label>
          <div class="mt-1 relative">
            <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" required [(ngModel)]="password"
              class="w-full bg-input-bg border border-input-border rounded-xl pl-4 pr-10 py-3 text-input-text placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
            <button type="button" (click)="showPassword.set(!showPassword())"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text-heading transition-colors">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              }
            </button>
          </div>
          <div class="mt-2 text-center">
            <a routerLink="/forgot-password" class="font-medium text-emerald-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors text-xs">
              Forgot password?
            </a>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading()"
            class="w-full bg-emerald-500 hover:bg-emerald-600 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-bold py-3 px-4 rounded-xl transition-all shadow-md flex items-center justify-center space-x-2 text-sm disabled:opacity-50">
            @if (isLoading()) {
              <svg class="animate-spin h-5 w-5 text-white dark:text-slate-955" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Logging in...</span>
            } @else {
              <span>Sign in</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
