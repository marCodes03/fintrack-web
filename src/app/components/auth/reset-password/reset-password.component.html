<div class="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-surface-card border border-border-subtle rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
    <button (click)="onCancel()" class="absolute top-4 right-4 text-text-muted hover:text-text-heading transition-colors">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <h2 class="text-xl font-bold text-text-heading mb-2">Change Password</h2>
    <p class="text-xs text-text-muted mb-6">Verify current password and define a secure new password.</p>

    <form (submit)="handleResetPassword(); $event.preventDefault()" class="space-y-4">
      
      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/25 text-rose-500 text-sm">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-emerald-500 text-sm">
          {{ successMessage() }}
        </div>
      }

      <div>
        <label for="currentPassword" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">
          Current Password
        </label>
        <div class="relative">
          <input id="currentPassword" name="currentPassword" [type]="showCurrentPassword() ? 'text' : 'password'" required [(ngModel)]="currentPassword"
            class="w-full bg-input-bg border border-input-border rounded-xl pl-4 pr-10 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
          <button type="button" (click)="showCurrentPassword.set(!showCurrentPassword())"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text-heading transition-colors">
            @if (showCurrentPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div>
        <label for="newPassword" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">
          New Password
        </label>
        <div class="relative">
          <input id="newPassword" name="newPassword" [type]="showNewPassword() ? 'text' : 'password'" required [(ngModel)]="newPassword"
            class="w-full bg-input-bg border border-input-border rounded-xl pl-4 pr-10 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
          <button type="button" (click)="showNewPassword.set(!showNewPassword())"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text-heading transition-colors">
            @if (showNewPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div>
        <label for="confirmNewPassword" class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">
          Confirm New Password
        </label>
        <div class="relative">
          <input id="confirmNewPassword" name="confirmNewPassword" [type]="showConfirmNewPassword() ? 'text' : 'password'" required [(ngModel)]="confirmNewPassword"
            class="w-full bg-input-bg border border-input-border rounded-xl pl-4 pr-10 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
          <button type="button" (click)="showConfirmNewPassword.set(!showConfirmNewPassword())"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text-heading transition-colors">
            @if (showConfirmNewPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.815 7.815 3 3m-3-3-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-3 pt-4 border-t border-border-subtle mt-6">
        <button type="button" (click)="onCancel()"
          class="px-4 py-2 text-xs font-semibold text-text-muted hover:text-text-heading transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading()"
          class="bg-emerald-500 hover:bg-emerald-600 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-bold py-2 px-4 rounded-lg transition-all shadow-md text-xs disabled:opacity-50 flex items-center justify-center space-x-1">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4 text-white dark:text-slate-955" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Saving...</span>
          } @else {
            <span>Update Password</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
