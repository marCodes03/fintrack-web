<!-- Slideover menu container backdrop -->
@if (isOpen) {
<div animate.leave="overlay-leave" class="fixed inset-0 z-50 flex justify-end">
  <!-- Clickable dark backdrop -->
  <div (click)="onClose()" aria-hidden="true"
    class="fixed inset-0 scrim md:backdrop-blur-xs animate-in duration-300 fade-in"></div>

  <!-- Sliding Sidebar panel -->
  <div appDialog aria-label="Menu" (dialogClose)="onClose()" class="relative w-80 max-w-full bg-surface-card border-l border-border-subtle h-full flex flex-col shadow-2xl z-10 animate-in slide-in-from-right duration-300">

    <!-- Header: Logo + close -->
    <div class="flex items-center justify-between p-5 border-b border-border-subtle">
      <div class="flex items-center space-x-2.5">
        <img src="logo.png" alt="FinTrack Logo" class="h-8 w-8 object-contain" />
        <span class="text-sm font-bold tracking-tight text-text-heading">Menu Options</span>
      </div>
      <button (click)="onClose()" type="button" aria-label="Close menu"
        class="text-text-muted hover:text-text-heading transition-colors p-1.5 rounded-lg hover:bg-surface-subtle">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Scrollable Menu list links -->
    <nav aria-label="Main menu" class="flex-1 overflow-y-auto pb-3 px-3">
      <h2 class="px-4 pt-3 pb-1 text-xs font-semibold uppercase tracking-wider text-text-muted">Overview</h2>
      <a routerLink="/dashboard" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="home" class="mr-3 text-text-muted text-lg"/>
        Dashboard
      </a>
      <h2 class="px-4 pt-4 pb-1 text-xs font-semibold uppercase tracking-wider text-text-muted">Money</h2>
      <a routerLink="/accounts" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="landmark" class="mr-3 text-text-muted text-lg"/>
        Accounts
      </a>
      <a routerLink="/income" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="trending-up" class="mr-3 text-text-muted text-lg"/>
        Income
      </a>
      <a routerLink="/expenses" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="trending-down" class="mr-3 text-text-muted text-lg"/>
        Expenses
      </a>
      <a routerLink="/savings" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="coins" class="mr-3 text-text-muted text-lg"/>
        Savings
      </a>
      <a routerLink="/transactions" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="transfer" class="mr-3 text-text-muted text-lg"/>
        Transactions
      </a>
      <h2 class="px-4 pt-4 pb-1 text-xs font-semibold uppercase tracking-wider text-text-muted">Plan</h2>
      <a routerLink="/budgets" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="bar-chart" class="mr-3 text-text-muted text-lg"/>
        Budget Plan
      </a>
      <a routerLink="/references" (click)="onClose()" routerLinkActive="bg-surface-subtle text-text-heading before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1 before:rounded-full before:bg-accent-emerald" ariaCurrentWhenActive="page"
        class="relative flex items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color]">
        <app-icon name="clipboard" class="mr-3 text-text-muted text-lg"/>
        References
      </a>
    </nav>

    <!-- Preferences and account -->
    <div class="p-3 border-t border-border-subtle space-y-1">
      <div>
        <button type="button" (click)="accountOpen.set(!accountOpen())" [attr.aria-expanded]="accountOpen()" aria-controls="menu-account"
          class="flex w-full items-center px-3 py-2.5 rounded-xl hover:bg-surface-subtle transition-colors text-left">
          <span aria-hidden="true" class="h-8 w-8 shrink-0 rounded-lg bg-accent-emerald flex items-center justify-center font-bold text-on-accent text-sm mr-3">{{ user()?.name ? user()?.name?.charAt(0) : 'U' }}</span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-semibold text-text-heading truncate">{{ user()?.name || 'Account' }}</span>
            <span class="block text-xs text-text-muted truncate">{{ user()?.email }}</span>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-text-muted transition-transform" [class.rotate-180]="accountOpen()"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        @if (accountOpen()) {
        <div id="menu-account" animate.enter="reveal-enter" animate.leave="reveal-leave" class="mt-1 space-y-0.5">
        <button type="button" (click)="triggerResetPassword()"
          class="flex w-full items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color] text-left">
          <app-icon name="key" class="mr-3 text-text-muted text-lg"/>
          Reset password
        </button>
        <a routerLink="/reviews" (click)="onClose()"
          class="flex w-full items-center px-4 py-2.5 text-sm font-semibold text-text-body hover:bg-surface-subtle hover:text-text-heading rounded-xl transition-[color,background-color] text-left">
          <app-icon name="star" class="mr-3 text-text-muted text-lg"/>
          Write a review
        </a>
        <button type="button" (click)="handleLogout()"
          class="flex w-full items-center px-4 py-2.5 text-sm font-semibold text-accent-rose hover:bg-accent-rose/10 rounded-xl transition-[color,background-color] text-left">
          <app-icon name="log-out" class="mr-3 text-accent-rose text-lg"/>
          Log out
        </button>
        </div>
        }
      </div>
    </div>

  </div>
</div>
}
