<!-- Slideover menu container backdrop -->
@if (isOpen) {
<div class="fixed inset-0 z-50 flex justify-end">
  <!-- Clickable dark backdrop -->
  <div (click)="onClose()"
    class="fixed inset-0 bg-slate-950/60 dark:bg-slate-950/60 backdrop-blur-xs transition-opacity duration-300 animate-in fade-in"></div>

  <!-- Sliding Sidebar panel -->
  <div class="relative w-80 max-w-full bg-[var(--surface-card)] border-l border-[var(--border-subtle)] h-full flex flex-col shadow-2xl z-10 animate-in slide-in-from-right duration-300">

    <!-- Header: Logo + close -->
    <div class="flex items-center justify-between p-5 border-b border-[var(--border-subtle)]">
      <div class="flex items-center space-x-2.5">
        <img src="logo.png" alt="FinTrack Logo" class="h-8 w-8 object-contain" />
        <span class="text-sm font-bold tracking-tight text-[var(--text-heading)]">Menu Options</span>
      </div>
      <button (click)="onClose()"
        class="text-[var(--text-muted)] hover:text-[var(--text-heading)] transition-colors p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Scrollable Menu list links -->
    <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      <a routerLink="/dashboard" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-blue-500 transition-colors text-lg">🏠</span>
        Dashboard
      </a>
      <a routerLink="/accounts" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-amber-500 transition-colors text-lg">🏦</span>
        Accounts
      </a>
      <a routerLink="/income" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-emerald-500 transition-colors text-lg">📈</span>
        Income
      </a>
      <a routerLink="/expenses" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-rose-500 transition-colors text-lg">📉</span>
        Expenses
      </a>
      <a routerLink="/savings" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-teal-500 transition-colors text-lg">💰</span>
        Savings
      </a>
      <a routerLink="/transactions" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-teal-400 transition-colors text-lg">💸</span>
        Transactions
      </a>
      <a routerLink="/budgets" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-indigo-500 transition-colors text-lg">📊</span>
        Budget Plan
      </a>
      <a routerLink="/references" (click)="onClose()"
        class="flex items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-violet-500 transition-colors text-lg">📋</span>
        References
      </a>
    </div>

    <!-- Action Operations Footer -->
    <div class="p-4 border-t border-[var(--border-subtle)] space-y-2">

      <!-- Hide Balances Toggle -->
      <button (click)="toggleHideAmounts()"
        class="flex w-full items-center justify-between px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <div class="flex items-center">
          <span class="mr-3 text-lg">{{ hideAmounts() ? '👁️' : '🕶️' }}</span>
          <span>Hide Balances</span>
        </div>
        <!-- Toggle pill -->
        <div class="relative w-10 h-5 rounded-full transition-colors duration-300"
             [class.bg-emerald-500]="hideAmounts()"
             [class.bg-slate-300]="!hideAmounts()">
          <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-300"
                [class.translate-x-5]="hideAmounts()"></span>
        </div>
      </button>

      <!-- Dark / Light Mode Toggle -->
      <button (click)="toggleTheme()"
        class="flex w-full items-center justify-between px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group">
        <div class="flex items-center">
          <span class="mr-3 text-lg">{{ isDarkMode() ? '☀️' : '🌙' }}</span>
          <span>{{ isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode' }}</span>
        </div>
        <!-- Toggle pill -->
        <div class="relative w-10 h-5 rounded-full transition-colors duration-300"
             [class.bg-emerald-500]="isDarkMode()"
             [class.bg-slate-300]="!isDarkMode()">
          <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-300"
                [class.translate-x-5]="isDarkMode()"></span>
        </div>
      </button>

      <button (click)="triggerResetPassword()"
        class="flex w-full items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group text-left">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-amber-500 transition-colors text-lg">🔑</span>
        Reset Password
      </button>
      <a routerLink="/reviews" (click)="onClose()"
        class="flex w-full items-center px-4 py-3 text-xs font-semibold text-[var(--text-body)] hover:bg-black/5 dark:hover:bg-white/5 hover:text-[var(--text-heading)] rounded-xl transition-all group text-left">
        <span class="mr-3 text-[var(--text-muted)] group-hover:text-yellow-500 transition-colors text-lg">⭐</span>
        Write a Review
      </a>
      <button (click)="handleLogout()"
        class="flex w-full items-center px-4 py-3 text-xs font-semibold text-rose-500 hover:bg-rose-500/10 rounded-xl transition-all group text-left">
        <span class="mr-3 text-rose-400 text-lg">🚪</span>
        Log Out
      </button>
    </div>

  </div>
</div>
}
