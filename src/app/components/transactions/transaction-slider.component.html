@if (isOpen) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- Backdrop -->
    <div (click)="onClose()" class="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-xs transition-opacity duration-300 animate-in fade-in"></div>

    <!-- Slide Panel -->
    <div class="relative w-96 max-w-full bg-surface-card border-l border-border-subtle h-full flex flex-col shadow-2xl z-10 animate-in slide-in-from-right duration-300">
      
      <!-- Header -->
      <div class="flex items-center justify-between p-5 border-b border-border-subtle">
        <h3 class="text-sm font-bold text-text-heading">{{ isEditMode ? 'Edit Transaction' : 'Record New Transaction' }}</h3>
        <button (click)="onClose()" class="text-text-muted hover:text-text-heading transition-colors p-1.5 rounded-lg hover:bg-surface-subtle">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Form Body -->
      <div class="flex-1 overflow-y-auto p-6 space-y-5">
        @if (errorMessage()) {
          <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/25 text-rose-500 text-xs">
            {{ errorMessage() }}
          </div>
        }

        <!-- Transaction Type -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Transaction Type *</label>
          <select [(ngModel)]="localType" (change)="onTypeChange()"
            class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
            <option value="EXPENSE">Expense</option>
            <option value="INCOME">Income</option>
            <option value="TRANSFER">Internal Transfer</option>
          </select>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Title *</label>
          <input type="text" [(ngModel)]="localDescription" placeholder="e.g. Grocery Shopping or Transfer"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-emerald-500 text-sm">
        </div>

        <!-- Amount -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Amount (₱) *</label>
          <input type="number" [(ngModel)]="localAmount" placeholder="0.00" min="0.01" step="0.01"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-emerald-500 text-sm">
        </div>

        <!-- Category (Non-Transfer) -->
        @if (localType !== 'TRANSFER') {
          <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Category *</label>
            <select [(ngModel)]="localCategory" class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
              @if (localType === 'INCOME') {
                @for (cat of incomeCategories(); track cat.id) {
                  <option [value]="cat.name">{{ cat.name }}</option>
                }
              } @else {
                @for (cat of expenseCategories(); track cat.id) {
                  <option [value]="cat.name">{{ cat.name }}</option>
                }
              }
            </select>
          </div>
        }

        <!-- Source Account -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">
            {{ localType === 'TRANSFER' ? 'Source Account *' : 'Account *' }}
          </label>
          <select [(ngModel)]="localAccountId" class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
            @for (acc of accounts; track acc.id) {
              <option [value]="acc.id">{{ acc.name }} (₱{{ acc.balance | number:'1.2-2' }}) [{{ acc.type }}]</option>
            }
          </select>
        </div>

        <!-- Destination Account & Transfer Fee (If Transfer) -->
        @if (localType === 'TRANSFER') {
          <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Destination Account *</label>
            <select [(ngModel)]="localToAccountId" class="w-full bg-input-bg border border-input-border rounded-xl px-3 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
              @for (acc of accounts; track acc.id) {
                <option [value]="acc.id">{{ acc.name }} (₱{{ acc.balance | number:'1.2-2' }})</option>
              }
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Transfer Fee (₱)</label>
            <input type="number" [(ngModel)]="localTransferFee" placeholder="0.00" min="0" step="0.01"
              class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text placeholder-text-muted focus:outline-none focus:border-emerald-500 text-sm">
          </div>
        }

        <!-- Date -->
        <div>
          <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Date *</label>
          <input type="date" [(ngModel)]="localExpenseDate"
            class="w-full bg-input-bg border border-input-border rounded-xl px-4 py-2.5 text-input-text focus:outline-none focus:border-emerald-500 text-sm">
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="p-5 border-t border-border-subtle bg-surface-subtle/50 space-y-2">
        <button (click)="onSubmit()" [disabled]="isLoading() || accounts.length === 0"
          class="w-full bg-emerald-500 hover:bg-emerald-600 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-bold py-3 px-4 rounded-xl transition-all text-sm disabled:opacity-50 flex items-center justify-center space-x-2">
          @if (isLoading()) {
            <span>Saving...</span>
          } @else {
            <span>{{ isEditMode ? 'Update Transaction' : 'Record Transaction' }}</span>
          }
        </button>
        <button (click)="onClose()" class="w-full bg-surface-subtle hover:bg-border-subtle text-text-body font-bold py-2.5 px-4 rounded-xl transition-all text-sm">
          Cancel
        </button>
      </div>

    </div>
  </div>
}
