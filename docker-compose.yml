version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    restart: always
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack_secret_password
      POSTGRES_DB: fintrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
